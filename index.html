<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アル君電卓（テスト版）</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #e0dad1;
    }
    .speech-bubble {
      background: #fff;
      border: 3px solid #744847;
      border-radius: 10px;
      padding: 10px;
      margin: 10px auto;
      max-width: 300px;
      font-weight: bold;
      color: #333;
      min-height: 40px;
    }
    .display {
      font-size: 28px;
      background: #fff;
      border: 2px solid #744847;
      padding: 10px;
      margin: 10px auto;
      max-width: 300px;
      text-align: right;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 300px;
      margin: 0 auto;
    }
    button {
      font-size: 20px;
      padding: 15px 0;
      background: #744847;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>アル君電卓（テスト）</h2>
  <div class="speech-bubble" id="speech">式を入力してね</div>
  <div class="display" id="display">0</div>

  <div class="buttons">
    <button onclick="input('+')">+</button>
    <button onclick="input('-')">-</button>
    <button onclick="input('/')">÷</button>
    <button onclick="input('*')">×</button>
    
    <button onclick="input('7')">7</button>
    <button onclick="input('8')">8</button>
    <button onclick="input('9')">9</button>
    <button onclick="clearDisplay()">C</button>
    
    <button onclick="input('4')">4</button>
    <button onclick="input('5')">5</button>
    <button onclick="input('6')">6</button>
    <button onclick="deleteLast()">BS</button>
    
    <button onclick="input('1')">1</button>
    <button onclick="input('2')">2</button>
    <button onclick="input('3')">3</button>
    <button onclick="calculate()">=</button>
    
    <button onclick="input('0')">0</button>
    <button onclick="input('.')">.</button>
  </div>

<script>
let current = "";

function input(val) {
  current += val;
  document.getElementById("display").textContent = current;
}

function clearDisplay() {
  current = "";
  document.getElementById("display").textContent = "0";
  document.getElementById("speech").textContent = "クリアしたよ";
}

function deleteLast() {
  current = current.slice(0, -1);
  document.getElementById("display").textContent = current || "0";
}

function calculate() {
  try {
    if (!current) return;
    
    // 式の末尾チェック
    if (/[\+\-\*\/]$/.test(current)) {
      document.getElementById("speech").textContent = "式が途中で終わっています";
      return;
    }

    // 計算実行（足し算・引き算・掛け算・割り算）
    const tokens = current.match(/(\d+\.?\d*|[\+\-\*\/])/g);
    if (!tokens) {
      document.getElementById("speech").textContent = "文字の分離に失敗";
      return;
    }

    // 先に掛け算・割り算
    let work = [];
    let i = 0;
    while (i < tokens.length) {
      if (tokens[i] === '*' || tokens[i] === '/') {
        let prev = parseFloat(work.pop());
        let next = parseFloat(tokens[i+1]);
        let res = tokens[i] === '*' ? prev * next : prev / next;
        work.push(res);
        i += 2;
      } else {
        work.push(tokens[i]);
        i++;
      }
    }

    // 次に足し算・引き算
    let total = parseFloat(work[0]);
    for (let j = 1; j < work.length; j += 2) {
      let op = work[j];
      let val = parseFloat(work[j+1]);
      if (op === '+') total += val;
      if (op === '-') total -= val;
    }

    document.getElementById("display").textContent = total;
    document.getElementById("speech").textContent = "計算できたよ！: " + total;
    current = total.toString();

  } catch (err) {
    // エラーが起きたらその理由を吹き出しに表示する
    document.getElementById("speech").textContent = "エラーが発生: " + err.message;
  }
}
</script>
</body>
</html>
